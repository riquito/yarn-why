[package]
version = "1.2.0"
name = "yarn-why"
description = "yarn why, but fast"
authors = ["Riccardo Attilio Galli <riccardo@sideralis.org>"]
homepage = "https://github.com/riquito/yarn-why"
edition = "2021"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "yarn-why"
path = "src/main.rs"

[lib]
name = "yarn_why"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
fxhash = "0.2.1"
once_cell = "1.21.4"
pico-args = "0.5.0"
semver = "1.0.28"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.150"
yarn-lock-parser = { version = "0.14.0" }

# Only needed when building the npm package (wasm32-unknown-unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.104"

[dev-dependencies]
assert_cmd = "2.2.2"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

# Used for the npm package, see npm/build.sh
[profile.web-release]
inherits = "release"
opt-level = "s"
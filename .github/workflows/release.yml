name: Release

defaults:
  run:
    shell: bash

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  check_if_safe:
    name: Check if safe to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy, rustfmt

      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features

      - uses: actions-rs/cargo@v1
        with:
          command: check

      - uses: actions-rs/cargo@v1
        with:
          command: test

  release:
    needs: check_if_safe
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: yarn-why
            asset_name: yarn-why-linux-amd64
          - os: macos-latest
            artifact_name: yarn-why
            asset_name: yarn-why-macos-amd64
          - os: windows-latest
            artifact_name: yarn-why.exe
            asset_name: yarn-why-windows-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build project
        run: cargo build --release --locked

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true

  macos_arm:
    needs: check_if_safe
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install ARM target
        run: rustup update && rustup target add aarch64-apple-darwin

      - name: Test
        run: cargo test --release

      - name: Build ARM
        run: cargo build --release --target=aarch64-apple-darwin

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/yarn-why
          asset_name: yarn-why-macos-aarch64
          tag: ${{ github.ref }}
          overwrite: true

  npm_package:
    needs: check_if_safe
    name: Publish the npm package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # so npm can attach a provenance statement to the published package
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Check the versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pkg=$(node -p "require('./npm/package.json').version")
          echo "tag=$tag crate=$crate npm=$pkg"
          if [ "$tag" != "$crate" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag, Cargo.toml and npm/package.json must agree"
            exit 1
          fi

      - name: Build
        run: npm/build.sh

      - name: Test
        working-directory: npm
        run: node --test

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload the wasm module to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: npm/wasm/yarn_why_bg.wasm
          asset_name: yarn-why.wasm
          tag: ${{ github.ref }}
          overwrite: true
